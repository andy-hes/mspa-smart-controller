esphome:
  name: mspa-uvc-ozone-test
  friendly_name: MSpa UVC Ozone Test
  includes:
    - mspa_tm1650_display.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(boot_ms) = millis();
          id(restore_pending) = true;
          id(filter_switch).publish_state(id(desired_filter_val));
          id(heater_switch).publish_state(id(desired_heater_val));
          id(bubbles_switch).publish_state(id(desired_bubbles_val) > 0);
          id(bubble_level_num).publish_state(id(desired_bubbles_val));
          id(target_temp).publish_state(id(target_temp_val));

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO
  logs:
    uart: NONE

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MSpa-Mist-Fallback"
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

output:
  - platform: gpio
    id: led_filter_active
    pin: GPIO21
  - platform: gpio
    id: led_heater_function
    pin: GPIO19
  - platform: gpio
    id: led_bubbles_active
    pin: GPIO18
  - platform: gpio
    id: led_general_error
    pin: GPIO5
  - platform: gpio
    id: led_heater_heating
    pin: GPIO4

globals:
  - id: current_temp_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: have_current_temp
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: target_temp_val
    type: int
    restore_value: yes
    initial_value: '38'
  - id: bubble_level_val
    type: int
    restore_value: no
    initial_value: '0'
  - id: desired_filter_val
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: desired_heater_val
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: desired_bubbles_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: desired_ozone_val
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desired_uvc_val
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: heater_call_for_heat
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: bath_status_val
    type: int
    restore_value: no
    initial_value: '0'
  - id: status_18_val
    type: int
    restore_value: no
    initial_value: '0'
  - id: status_1a_val
    type: int
    restore_value: no
    initial_value: '0'
  - id: spa_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: restore_pending
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: restore_delay_s
    type: int
    restore_value: yes
    initial_value: '60'
  - id: temp_multiplier
    type: int
    restore_value: yes
    initial_value: '1'
  - id: display_last_interaction_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: display_forced_value
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_forced_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

sensor:
  - platform: template
    name: "MSpa Current Temperature"
    id: current_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "MSpa Bath Status Code"
    id: bath_status_code
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "MSpa Status 0x18"
    id: status_18_sensor
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "MSpa Status 0x1A"
    id: status_1a_sensor
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "MSpa Status 0x0E"
    id: status_0e_sensor
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "MSpa Status 0x15"
    id: status_15_sensor
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    name: "MSpa Online"
    id: online_status
    lambda: |-
      return id(spa_online);
  - platform: template
    name: "MSpa Running (from status)"
    id: running_status
    lambda: |-
      return id(bath_status_val) == 0x03;
  - platform: template
    name: "MSpa Heater Calling For Heat"
    id: heater_call_active
    lambda: |-
      return id(desired_heater_val) && id(heater_call_for_heat);
  - platform: template
    name: "MSpa Error Offline"
    id: error_or_offline
    lambda: |-
      return !id(spa_online);
  - platform: gpio
    id: btn_mode_jet
    name: "MSpa Mode Jet Button"
    internal: true
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
    on_press:
      then:
        - lambda: 'id(display_last_interaction_ms) = millis();'
        - logger.log: "PCB button: MODE/JET -> restore desired mode"
        - button.press: restore_button
  - platform: gpio
    id: btn_heater
    name: "MSpa Heater Button"
    internal: true
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
    on_press:
      then:
        - lambda: 'id(display_last_interaction_ms) = millis();'
        - if:
            condition:
              switch.is_on: heater_switch
            then:
              - switch.turn_off: heater_switch
            else:
              - switch.turn_on: heater_switch
  - platform: gpio
    id: btn_filter
    name: "MSpa Filter Button"
    internal: true
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
    on_press:
      then:
        - lambda: 'id(display_last_interaction_ms) = millis();'
        - if:
            condition:
              switch.is_on: filter_switch
            then:
              - switch.turn_off: filter_switch
            else:
              - switch.turn_on: filter_switch
  - platform: gpio
    id: btn_timer
    name: "MSpa Timer Button"
    internal: true
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
    on_press:
      then:
        - lambda: 'id(display_last_interaction_ms) = millis();'
        - if:
            condition:
              switch.is_on: auto_restore_enabled
            then:
              - switch.turn_off: auto_restore_enabled
              - logger.log: "PCB button: auto restore OFF"
            else:
              - switch.turn_on: auto_restore_enabled
              - logger.log: "PCB button: auto restore ON"
  - platform: gpio
    id: btn_bubbles
    name: "MSpa Bubbles Button"
    internal: true
    pin:
      number: GPIO25
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
    on_press:
      then:
        - lambda: 'id(display_last_interaction_ms) = millis();'
        - if:
            condition:
              switch.is_on: bubbles_switch
            then:
              - switch.turn_off: bubbles_switch
            else:
              - switch.turn_on: bubbles_switch
  - platform: gpio
    id: btn_temp_down
    name: "MSpa Temp Down Button"
    internal: true
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
    on_press:
      then:
        - lambda: 'id(display_last_interaction_ms) = millis();'
        - lambda: |-
            int next = id(target_temp_val) - 1;
            if (next < 15) next = 15;
            id(target_temp_val) = next;
            id(display_forced_value) = id(target_temp_val);
            id(display_forced_until_ms) = millis() + 10000;
        - number.set:
            id: target_temp
            value: !lambda 'return id(target_temp_val);'
  - platform: gpio
    id: btn_temp_up
    name: "MSpa Temp Up Button"
    internal: true
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
    on_press:
      then:
        - lambda: 'id(display_last_interaction_ms) = millis();'
        - lambda: |-
            int next = id(target_temp_val) + 1;
            if (next > 40) next = 40;
            id(target_temp_val) = next;
            id(display_forced_value) = id(target_temp_val);
            id(display_forced_until_ms) = millis() + 10000;
        - number.set:
            id: target_temp
            value: !lambda 'return id(target_temp_val);'

text_sensor:
  - platform: template
    name: "MSpa Raw Status"
    id: raw_status
    update_interval: never

climate:
  - platform: thermostat
    name: "MSpa Thermostat"
    id: mspa_thermostat
    sensor: current_temp
    min_heating_off_time: 30s
    min_heating_run_time: 30s
    min_idle_time: 30s
    visual:
      min_temperature: 15 °C
      max_temperature: 40 °C
      temperature_step: 1 °C
    heat_action:
      - switch.turn_on: heater_switch
    idle_action:
      - switch.turn_off: heater_switch
    target_temperature_change_action:
      - lambda: |-
          id(target_temp_val) = (int) roundf(id(mspa_thermostat).target_temperature);
      - number.set:
          id: target_temp
          value: !lambda 'return id(target_temp_val);'

number:
  - platform: template
    name: "MSpa Target Temperature"
    id: target_temp
    min_value: 15
    max_value: 40
    step: 1
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 38
    unit_of_measurement: "°C"
    on_value:
      then:
        - lambda: |-
            id(target_temp_val) = (int)x;
        - script.execute:
            id: send_frame
            code: 0x04
            value: !lambda 'return id(target_temp_val) * id(temp_multiplier);'
  - platform: template
    name: "MSpa Restore Delay"
    id: restore_delay
    min_value: 10
    max_value: 300
    step: 5
    restore_value: true
    optimistic: true
    initial_value: 60
    unit_of_measurement: "s"
    on_value:
      then:
        - lambda: |-
            id(restore_delay_s) = (int)x;
  - platform: template
    name: "MSpa Thermostat Hysteresis"
    id: thermostat_hysteresis
    min_value: 0.5
    max_value: 2.0
    step: 0.5
    mode: box
    restore_value: true
    optimistic: true
    initial_value: 1.0
    unit_of_measurement: "°C"
  - platform: template
    name: "MSpa Temperature Multiplier"
    id: temp_multiplier_num
    min_value: 1
    max_value: 2
    step: 1
    restore_value: true
    optimistic: true
    initial_value: 1
    on_value:
      then:
        - lambda: |-
            id(temp_multiplier) = (int)x;
  - platform: template
    name: "MSpa Bubble Level"
    id: bubble_level_num
    min_value: 0
    max_value: 3
    step: 1
    mode: box
    restore_value: false
    optimistic: true
    initial_value: 0
    on_value:
      then:
        - lambda: |-
            id(desired_bubbles_val) = (int)x;
            id(bubble_level_val) = (int)x;
            id(bubbles_switch).publish_state(id(desired_bubbles_val) > 0);
        - script.execute:
            id: send_frame
            code: 0x03
            value: !lambda 'return id(desired_bubbles_val);'

switch:
  - platform: template
    name: "MSpa Auto Restore Enabled"
    id: auto_restore_enabled
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  - platform: template
    name: "MSpa Filter"
    id: filter_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_off:
      then:
        - lambda: |-
            id(desired_filter_val) = false;
            id(desired_heater_val) = false;
        - script.execute:
            id: send_frame
            code: 0x02
            value: 0
        - switch.turn_off: heater_switch
    on_turn_on:
      then:
        - lambda: id(desired_filter_val) = true;
        - script.execute:
            id: send_frame
            code: 0x02
            value: 1

  - platform: template
    name: "MSpa Heater"
    id: heater_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        - lambda: |-
            id(desired_heater_val) = true;
            id(desired_filter_val) = true;
            id(heater_call_for_heat) = true;
        - switch.turn_on: filter_switch
        - script.execute:
            id: send_frame
            code: 0x01
            value: 1
    on_turn_off:
      then:
        - lambda: |-
            id(desired_heater_val) = false;
            id(heater_call_for_heat) = false;
        - script.execute:
            id: send_frame
            code: 0x01
            value: 0

  - platform: template
    name: "MSpa Bubbles"
    id: bubbles_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      then:
        - lambda: |-
            id(bubble_level_val) = 1;
            id(desired_bubbles_val) = 1;
        - script.execute:
            id: send_frame
            code: 0x03
            value: 1
    on_turn_off:
      then:
        - lambda: |-
            id(bubble_level_val) = 0;
            id(desired_bubbles_val) = 0;
        - script.execute:
            id: send_frame
            code: 0x03
            value: 0

  - platform: template
    name: "MSpa Ozone (Experimental)"
    id: ozone_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      then:
        - lambda: id(desired_ozone_val) = true;
        - script.execute:
            id: send_frame
            code: 0x0E
            value: 1
    on_turn_off:
      then:
        - lambda: id(desired_ozone_val) = false;
        - script.execute:
            id: send_frame
            code: 0x0E
            value: 0

  - platform: template
    name: "MSpa UVC (Experimental)"
    id: uvc_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      then:
        - lambda: id(desired_uvc_val) = true;
        - script.execute:
            id: send_frame
            code: 0x15
            value: 1
    on_turn_off:
      then:
        - lambda: id(desired_uvc_val) = false;
        - script.execute:
            id: send_frame
            code: 0x15
            value: 0

button:
  - platform: template
    name: "MSpa Restore Desired Mode"
    id: restore_button
    on_press:
      then:
        - script.execute: restore_desired_mode

script:
  - id: send_frame
    mode: queued
    parameters:
      code: int
      value: int
    then:
      - lambda: |-
          const uint8_t start = 0xA5;
          const uint8_t c = static_cast<uint8_t>(code & 0xFF);
          const uint8_t v = static_cast<uint8_t>(value & 0xFF);
          const uint8_t chk = (start + c + v) & 0xFF;
          const uint8_t frame[4] = {start, c, v, chk};
          id(uart_bus).write_array(frame, 4);
          ESP_LOGI("mspa_tx", "TX: %02X %02X %02X %02X", frame[0], frame[1], frame[2], frame[3]);

  - id: restore_desired_mode
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_restore_enabled
              - binary_sensor.is_on: online_status
          then:
            - if:
                condition:
                  lambda: |-
                    return id(desired_filter_val) || id(desired_heater_val) || id(desired_bubbles_val) > 0;
                then:
                  - switch.turn_on: filter_switch
                else:
                  - switch.turn_off: filter_switch
            - delay: 600ms
            - number.set:
                id: target_temp
                value: !lambda 'return id(target_temp_val);'
            - delay: 600ms
            - if:
                condition:
                  lambda: 'return id(desired_heater_val);'
                then:
                  - if:
                      condition:
                        lambda: |-
                          return id(bath_status_val) == 0x03 || id(bath_status_val) == 0x00;
                      then:
                        - switch.turn_on: heater_switch
                      else:
                        - logger.log: "Restore skipped heater: unsafe/unknown status"
                else:
                  - switch.turn_off: heater_switch
            - delay: 600ms
            - script.execute:
                id: send_frame
                code: 0x03
                value: !lambda 'return id(desired_bubbles_val);'

interval:
  - interval: 200ms
    then:
      - lambda: |-
          uint8_t b;
          static uint8_t buffer[4];
          static int idx = 0;

          while (id(uart_bus).read_byte(&b)) {
            if (b == 0xA5) {
              idx = 0;
              buffer[idx++] = b;
              continue;
            }
            if (idx > 0 && idx < 4) {
              buffer[idx++] = b;
              if (idx == 4) {
                const uint8_t chk = (buffer[0] + buffer[1] + buffer[2]) & 0xFF;
                if (chk == buffer[3]) {
                  id(last_rx_ms) = millis();
                  id(spa_online) = true;
                  const uint8_t code = buffer[1];
                  const uint8_t value = buffer[2];

                  char hexbuf[32];
                  snprintf(hexbuf, sizeof(hexbuf), "%02X %02X %02X %02X", buffer[0], buffer[1], buffer[2], buffer[3]);
                  id(raw_status).publish_state(hexbuf);

                  if (code == 0x06) {
                    id(current_temp_val) = value / 2.0f;
                    id(have_current_temp) = true;
                    id(current_temp).publish_state(id(current_temp_val));
                  } else if (code == 0x08) {
                    id(bath_status_val) = value;
                    id(bath_status_code).publish_state(value);
                  } else if (code == 0x18) {
                    id(status_18_val) = value;
                    id(status_18_sensor).publish_state(value);
                  } else if (code == 0x1A) {
                    id(status_1a_val) = value;
                    id(status_1a_sensor).publish_state(value);
                  } else if (code == 0x0E) {
                    id(status_0e_sensor).publish_state(value);
                  } else if (code == 0x15) {
                    id(status_15_sensor).publish_state(value);
                  }
                }
                idx = 0;
              }
            }
          }

          if (id(last_rx_ms) > 0 && (millis() - id(last_rx_ms) > 10000)) {
            id(spa_online) = false;
          }

  - interval: 3s
    then:
      - lambda: |-
          if (id(restore_pending)) {
            const uint8_t frame[4] = {0xA5, 0x16, 0x00, static_cast<uint8_t>((0xA5 + 0x16) & 0xFF)};
            id(uart_bus).write_array(frame, 4);
            ESP_LOGD("mspa_tx", "TX hold: restore pending, heartbeat only");
            return;
          }

          // Periodic hold: keep desired state alive on the bus.
          // IMPORTANT: this uses desired_* values from HA commands, not RX-derived state.
          const int bubbles = id(desired_bubbles_val) > 0 ? id(desired_bubbles_val) : 0;
          const int filter = (id(desired_filter_val) || id(desired_heater_val) || bubbles > 0) ? 1 : 0;
          const float target = static_cast<float>(id(target_temp_val));
          const float hysteresis = id(thermostat_hysteresis).state;

          // Thermostat with hysteresis:
          // - start heating at/below target - hysteresis
          // - stop heating at/above target + hysteresis
          if (!id(desired_heater_val)) {
            id(heater_call_for_heat) = false;
          } else if (!id(have_current_temp)) {
            // On startup / missing temp feedback, allow heating request.
            id(heater_call_for_heat) = true;
          } else if (id(current_temp_val) <= (target - hysteresis)) {
            id(heater_call_for_heat) = true;
          } else if (id(current_temp_val) >= (target + hysteresis)) {
            id(heater_call_for_heat) = false;
          }

          const int heater = (id(desired_heater_val) && filter && id(heater_call_for_heat)) ? 1 : 0;
          const int setpoint = id(target_temp_val) * id(temp_multiplier);

          auto send = [&](uint8_t c, uint8_t v) {
            const uint8_t chk = (0xA5 + c + v) & 0xFF;
            const uint8_t frame[4] = {0xA5, c, v, chk};
            id(uart_bus).write_array(frame, 4);
            ESP_LOGD("mspa_tx", "TX hold: %02X %02X %02X %02X", frame[0], frame[1], frame[2], frame[3]);
          };

          send(0x02, filter);         // filter on/off
          send(0x01, heater);         // heater on/off
          send(0x03, bubbles);        // bubbles level 0..3
          send(0x04, setpoint);       // target temperature
          send(0x0E, id(desired_ozone_val) ? 0x01 : 0x00); // ozone (experimental)
          send(0x15, id(desired_uvc_val) ? 0x01 : 0x00);   // uvc (experimental)
          send(0x16, 0x00);           // heartbeat (needed by some models)

  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(restore_pending)) return false;
              if (!id(auto_restore_enabled).state) return false;
              const uint32_t elapsed = (millis() - id(boot_ms)) / 1000;
              return elapsed >= (uint32_t)id(restore_delay_s);
          then:
            - lambda: id(restore_pending) = false;
            - script.execute: restore_desired_mode

  - interval: 1s
    then:
      - lambda: |-
          static MspaTm1650Display display;
          static bool init_done = false;
          const bool boost = (millis() - id(display_last_interaction_ms)) < 10000;
          if (!init_done) {
            display.begin(23, 22);
            display.setBrightness(7);
            display.displayText3("888");
            id(display_last_interaction_ms) = millis();
            init_done = true;
            return;
          }

          display.setBrightness(boost ? 7 : 1);

          if (millis() < id(display_forced_until_ms)) {
            int shown = id(display_forced_value);
            if (shown < 0) shown = 0;
            if (shown > 999) shown = 999;
            display.displayNumber3(shown, false);
            return;
          }

          if (!id(spa_online)) {
            display.displayText3("OFF");
            return;
          }

          if (!id(have_current_temp)) {
            display.displayText3("Con");
            return;
          }

          int t = (int) roundf(id(current_temp_val) * 10.0f);
          if (t < 0) t = 0;
          if (t > 999) t = 999;
          display.displayNumber3(t, true);
      - if:
          condition:
            lambda: 'return id(desired_filter_val);'
          then:
            - output.turn_on: led_filter_active
          else:
            - output.turn_off: led_filter_active
      - if:
          condition:
            lambda: 'return id(desired_heater_val);'
          then:
            - output.turn_on: led_heater_function
          else:
            - output.turn_off: led_heater_function
      - if:
          condition:
            lambda: 'return id(desired_bubbles_val) > 0;'
          then:
            - output.turn_on: led_bubbles_active
          else:
            - output.turn_off: led_bubbles_active
      - if:
          condition:
            lambda: 'return id(desired_heater_val) && id(heater_call_for_heat);'
          then:
            - output.turn_on: led_heater_heating
          else:
            - output.turn_off: led_heater_heating
      - if:
          condition:
            lambda: 'return !id(spa_online);'
          then:
            - output.turn_on: led_general_error
          else:
            - output.turn_off: led_general_error
