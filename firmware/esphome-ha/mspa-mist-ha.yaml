esphome:
  name: mspa-mist-ha
  friendly_name: MSpa Mist Controller
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(boot_ms) = millis();
          id(restore_pending) = true;

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MSpa-Mist-Fallback"
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

globals:
  - id: current_temp_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: target_temp_val
    type: int
    restore_value: yes
    initial_value: '38'
  - id: bubble_level_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: bath_status_val
    type: int
    restore_value: no
    initial_value: '0'
  - id: spa_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: restore_pending
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: restore_delay_s
    type: int
    restore_value: yes
    initial_value: '60'
  - id: temp_multiplier
    type: int
    restore_value: yes
    initial_value: '1'

sensor:
  - platform: template
    name: "MSpa Current Temperature"
    id: current_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

binary_sensor:
  - platform: template
    name: "MSpa Online"
    id: online_status
    lambda: |-
      return id(spa_online);

text_sensor:
  - platform: template
    name: "MSpa Raw Status"
    id: raw_status
    update_interval: never

number:
  - platform: template
    name: "MSpa Target Temperature"
    id: target_temp
    min_value: 20
    max_value: 40
    step: 1
    restore_value: true
    optimistic: true
    initial_value: 38
    unit_of_measurement: "°C"
    on_value:
      then:
        - lambda: |-
            id(target_temp_val) = (int)x;
  - platform: template
    name: "MSpa Restore Delay"
    id: restore_delay
    min_value: 10
    max_value: 300
    step: 5
    restore_value: true
    optimistic: true
    initial_value: 60
    unit_of_measurement: "s"
    on_value:
      then:
        - lambda: |-
            id(restore_delay_s) = (int)x;

switch:
  - platform: template
    name: "MSpa Auto Restore Enabled"
    id: auto_restore_enabled
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  - platform: template
    name: "MSpa Filter"
    id: filter_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_off:
      then:
        - switch.turn_off: heater_switch

  - platform: template
    name: "MSpa Heater"
    id: heater_switch
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        - switch.turn_on: filter_switch

  - platform: template
    name: "MSpa Bubbles"
    id: bubbles_switch
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      then:
        - lambda: id(bubble_level_val) = 1;
    on_turn_off:
      then:
        - lambda: id(bubble_level_val) = 0;

button:
  - platform: template
    name: "MSpa Restore Desired Mode"
    id: restore_button
    on_press:
      then:
        - script.execute: restore_desired_mode

script:
  - id: send_frame
    mode: queued
    parameters:
      code: int
      value: int
    then:
      - lambda: |-
          const uint8_t start = 0xA5;
          const uint8_t c = static_cast<uint8_t>(code & 0xFF);
          const uint8_t v = static_cast<uint8_t>(value & 0xFF);
          const uint8_t chk = (start + c + v) & 0xFF;
          const uint8_t frame[4] = {start, c, v, chk};
          id(uart_bus).write_array(frame, 4);
          ESP_LOGI("mspa_tx", "TX: %02X %02X %02X %02X", frame[0], frame[1], frame[2], frame[3]);

  - id: restore_desired_mode
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_restore_enabled
              - binary_sensor.is_on: online_status
          then:
            - switch.turn_on: filter_switch
            - delay: 800ms
            - number.set:
                id: target_temp
                value: !lambda 'return id(target_temp_val);'
            - delay: 800ms
            - if:
                condition:
                  lambda: |-
                    return id(bath_status_val) == 0x03 || id(bath_status_val) == 0x00;
                then:
                  - switch.turn_on: heater_switch
                else:
                  - logger.log: "Restore skipped heater: unsafe/unknown status"

interval:
  - interval: 200ms
    then:
      - lambda: |-
          uint8_t b;
          static uint8_t buffer[4];
          static int idx = 0;

          while (id(uart_bus).read_byte(&b)) {
            if (b == 0xA5) {
              idx = 0;
              buffer[idx++] = b;
              continue;
            }
            if (idx > 0 && idx < 4) {
              buffer[idx++] = b;
              if (idx == 4) {
                const uint8_t chk = (buffer[0] + buffer[1] + buffer[2]) & 0xFF;
                if (chk == buffer[3]) {
                  id(last_rx_ms) = millis();
                  id(spa_online) = true;
                  const uint8_t code = buffer[1];
                  const uint8_t value = buffer[2];

                  char hexbuf[32];
                  snprintf(hexbuf, sizeof(hexbuf), "%02X %02X %02X %02X", buffer[0], buffer[1], buffer[2], buffer[3]);
                  id(raw_status).publish_state(hexbuf);

                  if (code == 0x06) {
                    id(current_temp_val) = value / 2.0f;
                    id(current_temp).publish_state(id(current_temp_val));
                  } else if (code == 0x08) {
                    id(bath_status_val) = value;
                  }
                }
                idx = 0;
              }
            }
          }

          if (id(last_rx_ms) > 0 && (millis() - id(last_rx_ms) > 10000)) {
            id(spa_online) = false;
          }

  - interval: 1s
    then:
      - lambda: |-
          const int bubbles = id(bubbles_switch).state ? id(bubble_level_val) : 0;
          const int heater = (id(heater_switch).state && id(filter_switch).state) ? 1 : 0;
          const int filter = id(filter_switch).state ? 1 : 0;
          const int setpoint = id(target_temp_val) * id(temp_multiplier);

          auto send = [&](uint8_t c, uint8_t v) {
            const uint8_t chk = (0xA5 + c + v) & 0xFF;
            const uint8_t frame[4] = {0xA5, c, v, chk};
            id(uart_bus).write_array(frame, 4);
          };

          send(0x02, filter);         // filter on/off
          send(0x01, heater);         // heater on/off
          send(0x03, bubbles);        // bubbles level 0..3
          send(0x04, setpoint);       // target temperature

  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(restore_pending)) return false;
              if (!id(auto_restore_enabled).state) return false;
              const uint32_t elapsed = (millis() - id(boot_ms)) / 1000;
              return elapsed >= (uint32_t)id(restore_delay_s);
          then:
            - lambda: id(restore_pending) = false;
            - script.execute: restore_desired_mode
